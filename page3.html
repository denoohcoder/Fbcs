<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FBC Bank - Loan Application</title>

    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --fbc-primary: #003366;
            --fbc-hover: #002244;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #002244;
            --text-muted: #888888;
            --input-border: #cbd5e1;
            --btn-gray: #e2e8f0;
            --btn-gray-text: #475569;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .app-header {
            width: 100%;
            background-color: var(--fbc-primary);
            height: 60px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-btn-top {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            font-size: 20px;
            font-weight: 800;
            color: white;
        }

        .header-title .fbc { color: white; margin-right: 4px; }
        .header-title .bank { color: #66b2ff; }

        .card {
            background: white;
            width: 90%;
            max-width: 440px;
            margin: 20px 0 30px;
            padding: 32px 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 51, 102, 0.08);
            display: flex;
            flex-direction: column;
        }

        .main-title {
            font-size: 24px;
            color: var(--text-main);
            margin: 0 0 6px;
            text-align: center;
            font-weight: 800;
        }

        .subtext {
            font-size: 14px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 20px;
        }

        .step-indicator {
            display: flex;
            justify-content: space-center;
            gap: 12px;
            margin: 0 auto 32px;
            width: 80%;
        }

        .step-bar {
            flex: 1;
            height: 4px;
            background-color: #cbd5e1;
            border-radius: 2px;
        }

        .step-bar.active {
            background-color: var(--fbc-primary);
        }

        .form-group {
            margin-bottom: 22px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 15px;
            font-weight: 700;
            color: #222222;
            margin-bottom: 10px;
        }

        .form-control {
            font-size: 15px;
            padding: 14px 16px;
            border: 1px solid var(--input-border);
            border-radius: 10px;
            background-color: #ffffff;
            color: #333333;
            outline: none;
            width: 100%;
        }

        .form-control:focus {
            border-color: var(--fbc-primary);
        }

        .phone-group {
            display: flex;
            gap: 10px;
        }

        .country-prefix {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background-color: #f1f5f9;
            border: 1px solid var(--input-border);
            border-radius: 10px;
            padding: 0 14px;
            font-weight: 700;
            font-size: 15px;
            color: #111111;
            white-space: nowrap;
        }

        .flag-icon {
            font-size: 18px;
            line-height: 1;
        }

        .phone-hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 8px;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .btn-prev {
            background-color: var(--btn-gray);
            color: var(--btn-gray-text);
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-next {
            background-color: var(--fbc-primary);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
        }

        .footer-banner {
            width: 100%;
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #666666;
            margin-top: auto;
        }
    </style>
</head>

<body>

<div class="app-header">
    <a onclick="goBack()" class="back-btn-top">← Back</a>
    <div class="header-title">
        <span class="fbc">FBC</span><span class="bank">Bank</span>
    </div>
    <div class="menu-icon">
        <span></span>
        <span></span>
        <span></span>
    </div>
</div>

<div class="card">
    <h1 class="main-title">Loan Application</h1>
    <div class="subtext">Step 2 of 3</div>

    <div class="step-indicator">
        <div class="step-bar active"></div>
        <div class="step-bar active"></div>
        <div class="step-bar"></div>
    </div>

    <form id="step2Form" onsubmit="goNext(event)">
        <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" class="form-control" placeholder="Tinashe" required>
        </div>

        <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" class="form-control" placeholder="Moyo" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" class="form-control" placeholder="tinashe.moyo@example.co.zw" required>
        </div>

        <div class="form-group">
            <label for="phone">Mobile Phone Number</label>
            <div class="phone-group">
                <div class="country-prefix">
                    <span class="flag-icon">🇿🇼</span>
                    <span>+263</span>
                </div>
                <input type="tel" id="phone" class="form-control" placeholder="771234567" maxlength="9" pattern="[7][1-8][0-9]{7}" required>
            </div>
            <div class="phone-hint">9 digits starting with 7 (e.g. 771234567)</div>
        </div>

        <div class="btn-container">
            <button type="button" class="btn-prev" onclick="goBack()">PREVIOUS</button>
            <button type="submit" class="btn-next">NEXT STEP</button>
        </div>
    </form>
</div>

<div class="footer-banner">
    © 2026 FBC Bank Zimbabwe
</div>

<script>
    window.onload = () => {
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const fName = localStorage.getItem('firstName');
        const lName = localStorage.getItem('lastName');
        const email = localStorage.getItem('email');
        const phone = localStorage.getItem('phone');

        if (fName) document.getElementById('firstName').value = fName;
        if (lName) document.getElementById('lastName').value = lName;
        if (email) document.getElementById('email').value = email;
        if (phone) document.getElementById('phone').value = phone;
    };

    function goNext(event) {
        event.preventDefault();

        const fName = document.getElementById('firstName').value.trim();
        const lName = document.getElementById('lastName').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();

        if (!fName || !lName || !email || !phone) {
            alert("Please fill in all required fields.");
            return;
        }

        if (!/^7[1-8]\d{7}$/.test(phone)) {
            alert("Please enter a valid Zimbabwean mobile number (e.g., 771234567).");
            return;
        }

        localStorage.setItem('firstName', fName);
        localStorage.setItem('lastName', lName);
        localStorage.setItem('email', email);
        localStorage.setItem('phone', phone);
        localStorage.setItem('userPhone', phone);

        window.location.href = "/page4";
    }

    function goBack() {
        window.location.href = "/page2";
    }
</script>

</body>
</html>
